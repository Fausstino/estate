<!doctype html>
<html lang="ru">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Suleimanov Estate — Аренда недвижимости</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <header>
            <div class="container">
                <h1>Suleimanov Estate</h1>
                <p>Сервис поиска жилья</p>
            </div>
        </header>

        <main class="container">
            <section class="filters-card">
                <div class="filter-group">
                    <label>Поиск</label>
                    <input
                        type="text"
                        id="searchInput"
                        placeholder="Район или название..."
                    />
                </div>
                <div class="filter-group">
                    <label>Тип</label>
                    <select id="typeFilter">
                        <option value="all">Все типы</option>
                        <option value="apartment">Квартира</option>
                        <option value="house">Дом</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>Комнат</label>
                    <select id="roomsFilter">
                        <option value="all">Любое кол-во</option>
                        <option value="1">1 комната</option>
                        <option value="2">2 комнаты</option>
                        <option value="3">3+ комнаты</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>Цена до</label>
                    <input
                        type="number"
                        id="priceFilter"
                        placeholder="Бюджет"
                    />
                </div>
                <div class="filter-actions">
                    <button id="resetBtn" class="btn-secondary">
                        Сбросить
                    </button>
                </div>
            </section>

            <section id="catalog" class="catalog-grid"></section>
        </main>

        <div id="propertyModal" class="modal">
            <div class="modal-content">
                <span class="close-btn">&times;</span>
                <div id="modalBody"></div>
            </div>
        </div>

        <script src="script.js"></script>
    </body>
</html>
